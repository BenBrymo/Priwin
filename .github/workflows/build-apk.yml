name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Two apps from one project: Priwin (pro) and Priwin Picks (lite, for normal bettors).
      - name: Build debug APKs
        run: gradle assembleProDebug assembleLiteDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Priwin-debug-apk
          path: app/build/outputs/apk/pro/debug/app-pro-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PriwinPicks-debug-apk
          path: app/build/outputs/apk/lite/debug/app-lite-debug.apk

      # Release builds: optimised and much smoother than debug. Signed with the same key, so they install over the debug apps.
      - name: Build release APKs
        run: gradle assembleProRelease assembleLiteRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Priwin-release-apk
          path: app/build/outputs/apk/pro/release/app-pro-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PriwinPicks-release-apk
          path: app/build/outputs/apk/lite/release/app-lite-release.apk
